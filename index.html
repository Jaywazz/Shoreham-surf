
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shoreham Surf</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#082b40;color:white;font-family:Arial,sans-serif;overflow:hidden}
#game{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.panel{background:#082333d9;border:1px solid #8ed9e9;border-radius:12px;padding:9px 12px;box-shadow:0 3px 14px #00152255;font-size:13px}
.panel strong{color:#9af0f4}
#controls{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 16px;gap:10px}
button,select{border:1px solid #a9f3f8;border-radius:12px;background:#123d52;color:white;padding:12px;font-weight:bold;font-size:14px}
button{touch-action:none;user-select:none}
button:active{background:#167d95}
#steer{display:flex;gap:10px}
.big{width:68px;height:60px;font-size:23px}
#rightControls{display:flex;flex-direction:column;gap:8px;align-items:end}
#message{position:fixed;top:42%;left:0;right:0;text-align:center;font-size:clamp(22px,5vw,42px);font-weight:900;text-shadow:0 3px 8px #003;pointer-events:none}
#meter{height:9px;background:#50636b;border-radius:10px;overflow:hidden;width:150px;margin-top:5px}
#meterFill{height:100%;width:0;background:#65ff91}
#hint{position:fixed;bottom:100px;left:12px;right:12px;text-align:center;font-size:12px;color:#e4fbff;text-shadow:0 1px 5px #001}
@media(min-width:800px){#controls{padding:0 35px}.big{width:76px;height:65px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="panel"><strong>SHOREHAM SURF</strong><br><span id="status">Paddle out to catch a wave</span></div>
 <div class="panel">SCORE<br><strong id="score">0</strong></div>
 <div class="panel">SPEED<br><strong id="speed">0</strong> km/h</div>
 <div class="panel">BALANCE<br><strong id="balance">100%</strong></div>
 <div class="panel">DROP-IN TIMING<div id="meter"><div id="meterFill"></div></div></div>
 <div class="panel" id="forecast">Shoreham forecast<br><strong>Loading…</strong></div>
</div>
<div id="message">PADDLE OUT</div>
<div id="hint">Hold PADDLE to build speed • Catch the green zone • Steer to stay on the wave</div>
<div id="controls">
 <div id="steer">
  <button class="big" id="left">◀</button>
  <button class="big" id="right">▶</button>
 </div>
 <button id="paddle">PADDLE</button>
 <div id="rightControls">
  <select id="board" aria-label="Surfboard">
   <option value="0">Longboard</option>
   <option value="1">Fish</option>
   <option value="2">Shortboard</option>
   <option value="3">Gun</option>
  </select>
  <button id="restart">NEW WAVE ↻</button>
 </div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,DPR=1,last=0,time=0;
let surferX=.5,depth=.55,forward=0,speed=0,score=0,balance=100;
let phase='paddle',drop=0,dropWindow=0,steer=0,paddling=false;
let riderY=0,verticalV=0,pitch=0,roll=0,air=0,wipeout=0;
let boardType=0,combo=0,best=0,foam=[],particles=[];
const boards=[
 {name:'Longboard',speed:0.84,stability:1.45,turn:0.65,color:'#f3d49b',length:1.2},
 {name:'Fish',speed:1.05,stability:1.05,turn:1.05,color:'#ffad68',length:.92},
 {name:'Shortboard',speed:1.16,stability:.8,turn:1.35,color:'#e8f6ff',length:.82},
 {name:'Gun',speed:1.12,stability:1.0,turn:.9,color:'#b7d5ff',length:1.08}
];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
function reset(){surferX=.5;depth=.55;forward=0;speed=0;balance=100;phase='paddle';drop=0;dropWindow=0;steer=0;verticalV=0;pitch=0;roll=0;air=0;wipeout=0;combo=0;$('message').textContent='PADDLE OUT';$('status').textContent='Paddle out to catch a wave';}
$('restart').onclick=reset;
$('board').onchange=e=>boardType=+e.target.value;
function hold(id,down,up){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);down()});b.addEventListener('pointerup',e=>{e.preventDefault();up()});b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)}
hold('left',()=>steer=-1,()=>{if(steer===-1)steer=0});
hold('right',()=>steer=1,()=>{if(steer===1)steer=0});
hold('paddle',()=>paddling=true,()=>paddling=false);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')steer=-1;if(e.key==='ArrowRight'||e.key==='d')steer=1;if(e.code==='Space'||e.key==='ArrowUp')paddling=true});
addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))steer=0;if(e.code==='Space'||e.key==='ArrowUp')paddling=false});
function wave(x,z){
 const crest=.43+.045*Math.sin(time*.42);
 const swell=Math.sin(x*5.1-time*1.5+z*2.0);
 const cross=Math.sin(x*11+time*1.1+z*4);
 const peak=Math.exp(-Math.pow((x-crest)/.25,2));
 const h=swell*.43+cross*.1+peak*.45;
 return {h,swell,peak,crest};
}
function project(x,z,h=0){
 const horizon=H*.32;
 const yy=horizon+z*(H*.73)-h*(H*.18+z*H*.08);
 const xx=W*.5+(x-.5)*(W*(.25+z*1.2));
 return [xx,yy];
}
function path(points,fill,stroke=null,width=1){
 ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
 if(fill){ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
}
function drawSky(){
 let g=ctx.createLinearGradient(0,0,0,H*.6);g.addColorStop(0,'#71c7e8');g.addColorStop(.65,'#d5f3f2');g.addColorStop(1,'#f7edcf');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#fff5d5';ctx.beginPath();ctx.arc(W*.79,H*.12,27,0,Math.PI*2);ctx.fill();
 // Shoreham hills and coast
 path([[0,H*.34],[W*.1,H*.29],[W*.2,H*.32],[W*.34,H*.27],[W*.47,H*.33],[W*.62,H*.29],[W*.75,H*.33],[W,H*.28],[W,H*.43],[0,H*.43]],'#8eae9a');
 path([[0,H*.36],[W*.12,H*.34],[W*.25,H*.36],[W*.42,H*.33],[W*.57,H*.36],[W*.74,H*.33],[W,H*.35],[W,H*.41],[0,H*.41]],'#b3c9b1');
 // houses along the shore
 for(let i=0;i<22;i++){
  let x=(i/22)*W+Math.sin(i*9)*5,y=H*.33+Math.sin(i*2)*H*.012,s=5+((i*7)%7);
  ctx.fillStyle=['#f1e5cd','#e8c5a4','#d4dfd4','#e8d8c5'][i%4];
  ctx.fillRect(x,y,s,s*.7);
  ctx.fillStyle='#986e61';ctx.beginPath();ctx.moveTo(x-2,y);ctx.lineTo(x+s/2,y-s*.35);ctx.lineTo(x+s+2,y);ctx.fill();
 }
 // distant breakwater
 ctx.strokeStyle='#6f817c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.05,H*.43);ctx.lineTo(W*.35,H*.41);ctx.stroke();
}
function drawOcean(){
 const rows=42,cols=65;
 for(let r=rows-1;r>=0;r--){
  const z=.06+(r/rows)*.94;
  let pts=[];
  for(let c=0;c<=cols;c++){
   const x=c/cols,w=wave(x,z),p=project(x,z,w.h);
   pts.push(p);
  }
  const fill=ctx.createLinearGradient(0,H*.32,0,H);
  fill.addColorStop(0,'#55c9d2');fill.addColorStop(.38,'#138ca9');fill.addColorStop(1,'#03425f');
  path([...pts,[W,H],[0,H]],fill);
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));
  ctx.strokeStyle='rgba(188,250,249,'+(.05+z*.2)+')';ctx.lineWidth=.5+z;ctx.stroke();
 }
 // animated wave ridges, foam
 for(let i=0;i<15;i++){
  const x=((i*.137+time*.018)%1),z=.2+((i*37)%70)/100;
  const w=wave(x,z),p=project(x,z,w.h+.05);
  ctx.strokeStyle='rgba(230,255,250,'+(.15+w.peak*.65)+')';ctx.lineWidth=1+z*2;
  ctx.beginPath();ctx.ellipse(p[0],p[1],(8+z*20)*(1+w.peak),2+z*5,-.06,0,Math.PI*1.2);ctx.stroke();
 }
 // crest foam rolls along the wave
 for(let i=0;i<40;i++){
  const x=(i/40+time*.025)%1,z=.32+Math.sin(i*12)*.12,w=wave(x,z);
  if(w.peak>.48){
   let p=project(x,z,w.h+.16);
   ctx.fillStyle='rgba(240,255,249,'+Math.min(.9,w.peak)+')';
   ctx.beginPath();ctx.ellipse(p[0],p[1],3+z*5,1+z*2,0,0,Math.PI*2);ctx.fill();
  }
 }
}
function drawSurfer(){
 const b=boards[boardType],x=surferX,z=depth,w=wave(x,z),p=project(x,z,w.h);
 const sx=p[0],sy=p[1]+(phase==='ride'?-12:2);
 const scale=.65+z*.85;
 ctx.save();ctx.translate(sx,sy);ctx.scale(scale,scale);
 // board shadow
 ctx.fillStyle='rgba(0,25,40,.24)';ctx.beginPath();ctx.ellipse(0,9,31,7,0,0,Math.PI*2);ctx.fill();
 // board with perspective angle and pitch
 ctx.save();ctx.rotate(steer*.13+roll*.13+pitch*.06);
 ctx.fillStyle='#e9f4ed';ctx.beginPath();ctx.moveTo(-35*b.length,0);ctx.quadraticCurveTo(-29*b.length,-6,0,-5);ctx.quadraticCurveTo(28*b.length,-5,35*b.length,0);ctx.quadraticCurveTo(20*b.length,7,0,6);ctx.quadraticCurveTo(-23*b.length,6,-35*b.length,0);ctx.fill();
 ctx.fillStyle=b.color;ctx.beginPath();ctx.ellipse(0,0,23*b.length,3.3,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#ffffffaa';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-22*b.length,0);ctx.lineTo(23*b.length,0);ctx.stroke();ctx.restore();
 if(phase==='paddle'){
  // prone surfer and animated paddling arms
  ctx.fillStyle='#f1b58a';ctx.beginPath();ctx.ellipse(0,-7,6,11,-.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e44f42';ctx.beginPath();ctx.ellipse(0,-9,5,8,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#f1b58a';ctx.lineWidth=3;
  let arm=Math.sin(time*13)*5;
  ctx.beginPath();ctx.moveTo(-2,-9);ctx.lineTo(-12,arm);ctx.moveTo(2,-9);ctx.lineTo(12,-arm);ctx.stroke();
  ctx.fillStyle='#f0c09c';ctx.beginPath();ctx.arc(0,-19,4,0,Math.PI*2);ctx.fill();
 }else{
  // crouched stance
  ctx.strokeStyle='#f0b58e';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-3,-20);ctx.lineTo(-9,-8);ctx.lineTo(-15,-2);ctx.moveTo(-9,-8);ctx.lineTo(5,-3);ctx.lineTo(13,0);ctx.stroke();
  ctx.fillStyle='#ee654c';ctx.beginPath();ctx.ellipse(0,-19,7,10,-.25,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#f0b58e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-2,-21);ctx.lineTo(-12,-15+steer*3);ctx.moveTo(3,-21);ctx.lineTo(13,-17-steer*3);ctx.stroke();
  ctx.fillStyle='#f1c29f';ctx.beginPath();ctx.arc(1,-32,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#263f4c';ctx.beginPath();ctx.arc(0,-34,5,Math.PI,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function draw(){
 drawSky();drawOcean();drawSurfer();
 // spray particles
 particles.forEach(q=>{ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle='#f4ffff';ctx.beginPath();ctx.arc(q.x*W,q.y*H,q.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
 // horizon shimmer
 ctx.fillStyle='#ffffff30';ctx.fillRect(0,H*.32,W,2);
}
function update(dt){
 time+=dt;
 const b=boards[boardType],w=wave(surferX,depth);
 if(phase==='paddle'){
  if(paddling){speed=Math.min(1.15,speed+dt*.42);depth=Math.max(.36,depth-dt*.035)}
  else speed=Math.max(0,speed-dt*.16);
  surferX+=steer*dt*.18;
  // moving toward the wave
  if(speed>.28)dropWindow=(Math.sin(time*1.25)+1)/2;
  if(speed>.48&&w.peak>.62){
   drop=Math.max(0,1-Math.abs(w.swell)*.9);
   $('meterFill').style.width=(drop*100)+'%';
   if(drop>.73){
    phase='ride';balance=100;score+=Math.round(speed*100);$('message').textContent='POP UP!';
    $('status').textContent='Ride the face and keep your balance';
    setTimeout(()=>{if(phase==='ride')$('message').textContent='RIDE THE WAVE'},700);
   }
  }else $('meterFill').style.width=(Math.max(0,speed*.3)*100)+'%';
 }else if(phase==='ride'){
  const slope=Math.cos(surferX*5.1-time*1.5);
  speed+=dt*(.24+Math.abs(slope)*.18-steer*steer*.09);
  speed=Math.max(.25,Math.min(1.8,speed));
  // steer changes position and the line down the wave
  surferX+=steer*dt*.23*b.turn*(.5+speed);
  surferX+=Math.sin(time*1.7+surferX*4)*dt*.018;
  surferX=Math.max(.08,Math.min(.92,surferX));
  const targetY=w.h*22;
  verticalV+=(targetY-riderY)*dt*5;
  verticalV*=Math.pow(.13,dt);
  riderY+=verticalV*dt;
  pitch+=(slope*.13-pitch)*dt*2;
  roll+=(steer*.6-roll)*dt*3;
  balance-=dt*(Math.abs(steer)*5+Math.abs(slope)*2.2)/b.stability;
  balance=Math.min(100,balance+dt*(paddling?3:0));
  score+=Math.round((speed*12+Math.abs(slope)*3)*dt);
  $('meterFill').style.width=balance+'%';
  if(Math.random()<dt*16&&Math.abs(steer)>.4){
   particles.push({x:surferX,y:.55+Math.random()*.12,life:.7,size:1+Math.random()*2});
  }
  if(balance<=0||surferX<.045||surferX>.955){
   phase='wipeout';wipeout=1.4;combo=0;$('message').textContent='WIPEOUT!';
   $('status').textContent='Paddle out and try again';
  }
 }else if(phase==='wipeout'){
  wipeout-=dt;speed*=Math.pow(.15,dt);
  if(wipeout<=0){phase='paddle';surferX=.5;depth=.56;speed=0;balance=100;$('message').textContent='PADDLE OUT';}
 }
 particles=particles.filter(q=>q.life>0);
 particles.forEach(q=>q.life-=dt);
 $('score').textContent=score;
 $('speed').textContent=Math.round(speed*28);
 $('balance').textContent=Math.max(0,Math.round(balance))+'%';
 if(phase==='paddle'){$('status').textContent=paddling?'Paddling… build speed':'Paddle out to catch a wave'}
 if(phase==='ride'&&balance<35)$('message').textContent='KEEP BALANCED!';
}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
// Live weather and marine forecast from Open-Meteo
async function forecast(){
 try{
  const lat=50.8338,lon=-0.2732;
  const urls=[
   `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,wind_direction_10m&timezone=Europe%2FLondon`,
   `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height,wave_period&timezone=Europe%2FLondon`
  ];
  const [a,b]=await Promise.all(urls.map(u=>fetch(u)));
  if(!a.ok||!b.ok)throw Error('forecast unavailable');
  const weather=await a.json(),marine=await b.json();
  const c=weather.current,m=marine.current;
  $('forecast').innerHTML=`SHOREHAM LIVE<br><strong>${Math.round(c.temperature_2m)}°C · Wind ${Math.round(c.wind_speed_10m)} km/h</strong><br>Waves ${m.wave_height==null?'—':m.wave_height.toFixed(1)+' m'} · Period ${m.wave_period==null?'—':m.wave_period.toFixed(0)+' s'}`;
 }catch(e){$('forecast').innerHTML='SHOREHAM FORECAST<br><strong>Live forecast unavailable</strong>'}
}
forecast();setInterval(forecast,10*60*1000);
})();
</script>
</body>
</html>
